name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-validation:
    name: Package metadata and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package metadata, protocol, and sample config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/accountserv.example.json").read_text(encoding="utf-8"))

          assert package["name"] == "com.nodokaha.accountserv"
          assert package["basisServer"]["modules"] == [
              {"path": "Runtime", "assembly": "BasisNetworkClient"},
              {"path": "Server~/BasisNetworkServer", "assembly": "BasisNetworkServer"},
          ]
          assert config["enabled"] is False
          assert config["security"]["minimumPasswordLength"] >= 12
          assert config["security"]["maximumFailedLogins"] > 0
          assert config["security"]["lockoutSeconds"] > 0

          required = [
              "Runtime/AccountServClientPackage.cs",
              "Runtime/BasisNetworkClient.asmref",
              "Runtime/Unity/BasisAccountServ.Unity.asmdef",
              "Runtime/Unity/BasisAccountServWindow.cs",
              "Server~/BasisNetworkServer/AccountServPackage.cs",
              "Server~/BasisNetworkServer/AccountServMessageHandler.cs",
              "Server~/BasisNetworkServer/AccountServService.cs",
          ]
          for name in required:
              assert Path(name).is_file(), f"Missing package source: {name}"

          assert json.loads(Path("Runtime/BasisNetworkClient.asmref").read_text())["reference"] == "BasisNetworkClient"
          assert json.loads(Path("Runtime/Unity/BasisAccountServ.Unity.asmdef").read_text())["name"] == "BasisAccountServ.Unity"
          print("Package metadata, client/server source, and sample config are valid.")
          PY

  basis-build:
    name: Compile AccountServ client and server modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AccountServ
        uses: actions/checkout@v4
        with:
          path: AccountServ

      - name: Checkout Basis Server
        uses: actions/checkout@v4
        with:
          repository: BasisVR/Basis
          ref: developer
          path: Basis

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Inject AccountServ source into Basis projects
        working-directory: Basis
        run: |
          cp ../AccountServ/Runtime/*.cs "Basis Server/BasisNetworkClient/"
          cp ../AccountServ/Server~/BasisNetworkServer/*.cs \
            "Basis Server/BasisNetworkServer/"

      - name: Build BasisNetworkClient with AccountServ
        working-directory: Basis
        run: |
          dotnet build "Basis Server/BasisNetworkClient/BasisNetworkClient.csproj" \
            --configuration Release

      - name: Build BasisNetworkServer with AccountServ
        working-directory: Basis
        run: |
          dotnet build "Basis Server/BasisNetworkServer/BasisNetworkServer.csproj" \
            --configuration Release
