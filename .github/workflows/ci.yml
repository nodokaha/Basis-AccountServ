name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-validation:
    name: Package metadata and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package metadata, client assembly, and sample config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/accountserv.example.json").read_text(encoding="utf-8"))

          assert package["name"] == "com.nodokaha.accountserv"
          assert package["basisServer"]["modules"] == [{
              "path": "Server~/BasisNetworkServer",
              "assembly": "BasisNetworkServer",
          }]
          assert config["enabled"] is False
          assert config["security"]["minimumPasswordLength"] >= 12
          assert config["security"]["maximumFailedLogins"] > 0
          assert config["security"]["lockoutSeconds"] > 0

          server_config = Path("Server~/BasisNetworkServer/AccountServPackage.cs").read_text(encoding="utf-8")
          environment_variables = [
              "ACCOUNTSERV_CONFIG_FILE",
              "ACCOUNTSERV_ENABLED",
              "ACCOUNTSERV_DATABASE",
              "ACCOUNTSERV_SECURITY_MINIMUM_PASSWORD_LENGTH",
              "ACCOUNTSERV_SECURITY_MAXIMUM_FAILED_LOGINS",
              "ACCOUNTSERV_SECURITY_LOCKOUT_SECONDS",
              "ACCOUNTSERV_SECURITY_SESSION_LIFETIME_MINUTES",
          ]
          for name in environment_variables:
              assert name in server_config, f"Missing server environment variable support: {name}"

          required = [
              "Runtime/Unity/AccountServClientPackage.cs",
              "Runtime/Unity/BasisAccountServ.Unity.asmdef",
              "Runtime/Unity/BasisAccountServWindow.cs",
              "Runtime/Unity/AccountServMenuProvider.cs",
              "Server~/BasisNetworkServer/AccountServPackage.cs",
              "Server~/BasisNetworkServer/AccountServMessageHandler.cs",
              "Server~/BasisNetworkServer/AccountServService.cs",
          ]
          for name in required:
              assert Path(name).is_file(), f"Missing package source: {name}"

          unity_assets = [
              "Runtime.meta",
              "Runtime/Unity.meta",
              "Runtime/Unity/AccountServClientPackage.cs.meta",
              "Runtime/Unity/BasisAccountServ.Unity.asmdef.meta",
              "Runtime/Unity/BasisAccountServWindow.cs.meta",
              "Runtime/Unity/AccountServMenuProvider.cs.meta",
          ]
          for name in unity_assets:
              assert Path(name).is_file(), f"Missing Unity metadata file: {name}"

          asmdef = json.loads(Path("Runtime/Unity/BasisAccountServ.Unity.asmdef").read_text())
          assert "Basis Framework" in asmdef["references"]
          assert "BasisNetworkCore" in asmdef["references"]
          print("Package metadata, Unity client sources, and sample config are valid.")
          PY

  basis-build:
    name: Compile AccountServ server module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AccountServ
        uses: actions/checkout@v4
        with:
          path: AccountServ

      - name: Checkout Basis Server
        uses: actions/checkout@v4
        with:
          repository: BasisVR/Basis
          ref: developer
          path: Basis

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Inject AccountServ source into BasisNetworkServer
        working-directory: Basis
        run: |
          cp ../AccountServ/Server~/BasisNetworkServer/*.cs \
            "Basis Server/BasisNetworkServer/"

      - name: Build BasisNetworkServer with AccountServ
        working-directory: Basis
        run: |
          dotnet build "Basis Server/BasisNetworkServer/BasisNetworkServer.csproj" \
            --configuration Release

  central-api-build:
    name: Build central authentication API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build API
        working-directory: Api~/BasisAccountServ.Api
        run: dotnet build BasisAccountServ.Api.csproj --configuration Release

      - name: Validate central identity schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path("Api~/BasisAccountServ.Api/Migrations/001_initial_schema.sql").read_text()
          required = [
              "CREATE TABLE IF NOT EXISTS accounts",
              "CREATE TABLE IF NOT EXISTS basis_servers",
              "CREATE TABLE IF NOT EXISTS account_basis_links",
              "CREATE TABLE IF NOT EXISTS server_roles",
              "CREATE TABLE IF NOT EXISTS oauth_clients",
              "CREATE TABLE IF NOT EXISTS oauth_authorization_codes",
              "CREATE TABLE IF NOT EXISTS oauth_refresh_tokens",
          ]
          for statement in required:
              assert statement in schema, f"Missing schema object: {statement}"
          assert "UNIQUE (server_id, basis_did)" in schema
          assert "CREATE TABLE IF NOT EXISTS account_did_keys" in schema
          assert "CREATE TABLE IF NOT EXISTS basis_did_link_challenges" in schema
          assert "signed_payload BYTEA NOT NULL" in schema
          assert "CHECK (role IN ('user', 'moderator', 'admin'))" in schema
          print("Central identity schema contains the expected server-scoped entities.")
          PY

  central-api-tests:
    name: Test Basis DID proof verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run central API tests
        run: dotnet test Api~/BasisAccountServ.Api.Tests/BasisAccountServ.Api.Tests.csproj --configuration Release
